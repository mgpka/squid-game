<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQUID GAME AL PRINCES</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        /* واجهة الدخول */
        #lobbyUI { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)), url('https://images.unsplash.com/photo-1634193295627-1cdddf751ebf?q=80&w=1000') center/cover; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 100; }
        #lobbyUI h1 { color: #ff0055; font-size: 38px; margin-bottom: 5px; text-shadow: 0 0 15px #ff0055; text-align: center; }
        .form-group { background: rgba(20, 20, 30, 0.85); border: 1px solid #ff0055; padding: 25px; border-radius: 12px; width: 320px; display: flex; flex-direction: column; gap: 12px; text-align: right; }
        .form-group label { font-size: 14px; color: #ccc; }
        .form-group input, .form-group select { padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #444; background: #111; color: white; text-align: center; }
        .gender-box { display: flex; gap: 10px; justify-content: center; }
        .gender-btn { flex: 1; padding: 8px; border: 1px solid #444; background: #222; color: #fff; border-radius: 6px; cursor: pointer; text-align: center; }
        .gender-btn.active { border-color: #ff0055; background: #ff0055; font-weight: bold; }
        #joinBtn { padding: 12px; font-size: 18px; font-weight: bold; background: #ff0055; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        
        /* واجهة اللعب HUD */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: none; }
        #topStats { position: absolute; top: 15px; width: 100%; text-align: center; color: white; font-size: 26px; font-weight: bold; text-shadow: 2px 2px 5px #000; }
        
        /* أزرار الصوت أعلى اليمين */
        #audioControls { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; pointer-events: auto; }
        .icon-btn { width: 45px; height: 45px; border-radius: 50%; background: rgba(0,0,0,0.6); border: 2px solid #fff; color: white; font-size: 20px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .icon-btn.off { background: rgba(255,0,0,0.7); border-color: red; }

        /* أزرار التحكم أسفل اليمين */
        #actionControls { position: absolute; bottom: 25px; right: 20px; display: flex; flex-direction: column; gap: 12px; pointer-events: auto; }
        .action-btn { width: 65px; height: 65px; border-radius: 50%; background: rgba(255, 0, 85, 0.8); border: 2px solid #fff; color: white; font-size: 16px; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .action-btn:active { transform: scale(0.9); }

        /* جير التحكم Joystick أسفل اليسار */
        #joystickZone { position: absolute; bottom: 25px; left: 25px; width: 120px; height: 120px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; pointer-events: auto; }
        #joystickKnob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: #ff0055; border-radius: 50%; }

        /* زر الإعدادات أعلى اليسار */
        #settingsBtn { position: absolute; top: 15px; left: 15px; pointer-events: auto; }
        #settingsMenu { position: absolute; top: 70px; left: 15px; background: rgba(15,15,20,0.95); border: 1px solid #ff0055; padding: 15px; border-radius: 10px; color: white; width: 230px; display: none; pointer-events: auto; }
        #settingsMenu label { font-size: 12px; display: block; margin-top: 8px; }
        #settingsMenu input[type="range"] { width: 100%; }

        #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: white; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <!-- واجهة التسجيل والدخول -->
    <div id="lobbyUI">
        <h1>SQUID GAME AL PRINCES</h1>
        <div class="form-group">
            <label>اسم اللاعب:</label>
            <input type="text" id="pName" placeholder="أدخل اسمك">
            
            <label>رقم اللاعب (1 - 30):</label>
            <input type="number" id="pNum" min="1" max="30" placeholder="مثلاً: 16">

            <label>حدد جنسك:</label>
            <div class="gender-box">
                <div class="gender-btn active" id="gMale" onclick="setGender('male')">ذكر ♂</div>
                <div class="gender-btn" id="gFemale" onclick="setGender('female')">بنت ♀</div>
            </div>

            <label>رمز الدخول للبطولة:</label>
            <input type="text" id="pPass" placeholder="أدخل الرمز">

            <button id="joinBtn" onclick="submitJoin()">دخول الساحة</button>
        </div>
    </div>

    <!-- واجهة اللعب HUD -->
    <div id="hud">
        <div id="topStats">
            <span id="playerCountDisplay">1/30</span><br>
            <span id="gameStatusText" style="font-size:18px; color:#ff0055;">في انتظار بدء المسؤول...</span>
        </div>

        <div id="settingsBtn" class="icon-btn" onclick="toggleSettings()">⚙️</div>

        <!-- قائمة الإعدادات -->
        <div id="settingsMenu">
            <h3 style="margin:0 0 10px 0; color:#ff0055;">الإعدادات</h3>
            <label>صوت اللعبة العام:</label>
            <input type="range" id="volMaster" min="0" max="1" step="0.1" value="1" onchange="updateVolumes()">
            <label>صوت اللاعبين:</label>
            <input type="range" id="volVoice" min="0" max="1" step="0.1" value="1" onchange="updateVolumes()">
            <label>صوت الموسيقى:</label>
            <input type="range" id="volMusic" min="0" max="1" step="0.1" value="1" onchange="updateVolumes()">
            <br><br>
            <button style="width:100%; background:red; color:white; border:none; padding:8px; border-radius:5px; cursor:pointer;" onclick="location.reload()">خروج من اللعبة</button>
        </div>

        <!-- أزرار الصوت أعلى اليمين -->
        <div id="audioControls">
            <div id="speakerBtn" class="icon-btn" onclick="toggleSpeaker()">🔊</div>
            <div id="micBtn" onclick="toggleMic()" class="icon-btn off">🎙️</div>
        </div>

        <!-- جير التحكم Joystick -->
        <div id="joystickZone"><div id="joystickKnob"></div></div>

        <!-- أزرار الحركة والضرب -->
        <div id="actionControls">
            <div class="action-btn" onclick="doJump()">قفز</div>
            <div class="action-btn" id="sprintBtn" onclick="toggleSprint()">ركض</div>
            <div class="action-btn" style="background:#ff3300;" onclick="doPunch()">ضرب 👊</div>
        </div>

        <div id="crosshair"></div>
    </div>

    <audio id="bgMusic" loop></audio>

    <script>
        const socket = io();
        let scene, camera, renderer, selectedGender = 'male';
        let otherPlayers = {};
        let myData = {};
        let isFrontManMode = false;
        let isSprinting = false;

        // استرجاع البيانات المحفوظة تلقائياً
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            if(urlParams.get('role') === 'frontman') {
                isFrontManMode = true;
                document.getElementById('pName').value = "Front Man";
                document.getElementById('pNum').value = "0";
                document.getElementById('pPass').value = "sqpr";
            } else {
                if(localStorage.getItem('sg_name')) document.getElementById('pName').value = localStorage.getItem('sg_name');
                if(localStorage.getItem('sg_num')) document.getElementById('pNum').value = localStorage.getItem('sg_num');
                if(localStorage.getItem('sg_gender')) setGender(localStorage.getItem('sg_gender'));
            }
        };

        function setGender(g) {
            selectedGender = g;
            document.getElementById('gMale').classList.toggle('active', g === 'male');
            document.getElementById('gFemale').classList.toggle('active', g === 'female');
        }

        function submitJoin() {
            const name = document.getElementById('pName').value;
            const num = parseInt(document.getElementById('pNum').value);
            const pass = document.getElementById('pPass').value;

            if(!name || (!isFrontManMode && (isNaN(num) || num < 1 || num > 30)) || !pass) {
                return alert("يرجى ملء جميع الحقول واختيار رقم بين 1 و 30!");
            }

            myData = { name, number: num, gender: selectedGender, pass, isFrontMan: isFrontManMode };

            socket.emit('verifyJoin', myData, (res) => {
                if(res.success) {
                    if(!isFrontManMode) {
                        localStorage.setItem('sg_name', name);
                        localStorage.setItem('sg_num', num);
                        localStorage.setItem('sg_gender', selectedGender);
                    }
                    document.getElementById('lobbyUI').style.display = 'none';
                    document.getElementById('hud').style.display = 'block';
                    init3D();
                } else {
                    alert(res.message);
                }
            });
        }

        // إعداد بيئة 3D (اللوبي)
        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a24);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 15);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(0, 20, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x555566));

            // أرضية وجدران اللوبي (غرفة النوم)
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x333344 }));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // إضافة أسرّة طابقية على الأطراف
            for(let i = -15; i <= 15; i += 10) {
                createBed(-18, i); createBed(18, i);
            }

            setupJoystick();
            animate();
        }

        function createBed(x, z) {
            const bed = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 5), new THREE.MeshStandardMaterial({ color: 0x555555 }));
            bed.position.set(x, 1.5, z);
            scene.add(bed);
        }

        // إنشاء مجسمات 3D للشخصيات (اللاعبين + Front Man)
        function createPlayerMesh(player) {
            const group = new THREE.Group();

            if (player.isFrontMan) {
                // مجسم Front Man المتميز باللون الأسود والقناع
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.6, 1.8, 16), new THREE.MeshStandardMaterial({ color: 0x050505 }));
                const head = new THREE.Mesh(new THREE.ConeGeometry(0.4, 0.6, 5), new THREE.MeshStandardMaterial({ color: 0x111111 }));
                head.position.y = 1.1; head.rotation.x = Math.PI;
                group.add(body, head);
            } else {
                // مجسم اللاعبين بالترينك الخضراء
                const color = player.gender === 'female' ? 0x00b386 : 0x008055;
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.8, 16), new THREE.MeshStandardMaterial({ color: color }));
                group.add(body);
            }

            // إضافة اسم ورقم اللاعب فوق رأسه
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 256; canvas.height = 64;
            ctx.fillStyle = player.isFrontMan ? '#ffb700' : '#ffffff';
            ctx.font = 'Bold 28px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(player.isFrontMan ? "VIP / Front Man" : `${player.name} (${player.number})`, 128, 40);

            const texture = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture }));
            sprite.position.y = 1.4; sprite.scale.set(3, 0.75, 1);
            group.add(sprite);

            scene.add(group);
            otherPlayers[player.id] = group;
        }

        // تحكم Joystick
        function setupJoystick() {
            const zone = document.getElementById('joystickZone');
            const knob = document.getElementById('joystickKnob');
            let active = false;

            zone.addEventListener('touchstart', () => active = true);
            window.addEventListener('touchend', () => {
                active = false; knob.style.top = '35px'; knob.style.left = '35px';
            });

            zone.addEventListener('touchmove', (e) => {
                if(!active) return;
                const touch = e.touches[0];
                const rect = zone.getBoundingClientRect();
                const x = touch.clientX - rect.left - 60;
                const y = touch.clientY - rect.top - 60;
                const dist = Math.min(Math.hypot(x, y), 40);
                const angle = Math.atan2(y, x);

                knob.style.left = `${35 + Math.cos(angle) * dist}px`;
                knob.style.top = `${35 + Math.sin(angle) * dist}px`;

                const speed = (isSprinting ? 0.2 : 0.1);
                camera.translateX((Math.cos(angle) * dist / 40) * speed);
                camera.translateZ((Math.sin(angle) * dist / 40) * speed);
            });
        }

        function doJump() { camera.position.y = 2.5; setTimeout(() => camera.position.y = 1.6, 300); }
        function toggleSprint() {
            isSprinting = !isSprinting;
            document.getElementById('sprintBtn').style.background = isSprinting ? '#00ffcc' : 'rgba(255, 0, 85, 0.8)';
        }
        function doPunch() { socket.emit('playerPunch', Object.keys(otherPlayers)[0]); }

        function toggleSettings() {
            const menu = document.getElementById('settingsMenu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function animate() {
            requestAnimationFrame(animate);
            if(renderer && scene && camera) {
                renderer.render(scene, camera);
                socket.emit('playerMove', { x: camera.position.x, y: camera.position.y, z: camera.position.z, rotationY: camera.rotation.y });
            }
        }

        // أحداث السيرفر المباشرة
        socket.on('updatePlayerCount', c => document.getElementById('playerCountDisplay').innerText = `${c}/30`);
        socket.on('currentPlayers', players => {
            Object.values(players).forEach(p => { if(p.id !== socket.id) createPlayerMesh(p); });
        });
        socket.on('newPlayerJoined', p => createPlayerMesh(p));
        socket.on('playerMoved', p => {
            if(otherPlayers[p.id]) otherPlayers[p.id].position.set(p.x, p.y - 0.9, p.z);
        });
        socket.on('playerDisconnected', id => {
            if(otherPlayers[id]) { scene.remove(otherPlayers[id]); delete otherPlayers[id]; }
        });

        socket.on('receiveAdminVoice', chunk => {
            const blob = new Blob([chunk], { type: 'audio/webm' });
            new Audio(URL.createObjectURL(blob)).play();
        });
    </script>
</body>
</html>
