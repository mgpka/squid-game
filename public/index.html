<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SQUID GAME AL PRINCES</title>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        #rotateNotice { position: fixed; top:0; left:0; width:100%; height:100%; background:#000; color:#fff; display:none; flex-direction:column; justify-content:center; align-items:center; z-index:9999; text-align:center; font-size:20px; }

        #lobbyUI { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)), url('https://images.unsplash.com/photo-1634193295627-1cdddf751ebf?q=80&w=1000') center/cover; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 100; }
        #lobbyUI h1 { color: #ff0055; font-size: 32px; margin-bottom: 12px; text-shadow: 0 0 15px #ff0055; text-align: center; font-weight: 900; }
        .form-group { background: rgba(20, 20, 30, 0.95); border: 2px solid #ff0055; padding: 20px; border-radius: 12px; width: 320px; display: flex; flex-direction: column; gap: 10px; text-align: right; box-shadow: 0 0 25px rgba(255,0,85,0.3); }
        .form-group label { font-size: 13px; color: #ddd; }
        .form-group input { padding: 10px; font-size: 15px; border-radius: 6px; border: 1px solid #444; background: #111; color: white; text-align: center; }
        .gender-box { display: flex; gap: 10px; }
        .gender-btn { flex: 1; padding: 8px; border: 1px solid #444; background: #222; color: #fff; border-radius: 6px; cursor: pointer; text-align: center; font-size: 14px; }
        .gender-btn.active { border-color: #ff0055; background: #ff0055; font-weight: bold; }
        #joinBtn { padding: 12px; font-size: 17px; font-weight: bold; background: #ff0055; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 5px; }

        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: none; }
        #topStats { position: absolute; top: 12px; width: 100%; text-align: center; color: white; text-shadow: 2px 2px 5px #000; font-family: sans-serif; }
        #playerCountDisplay { font-size: 34px; font-weight: 900; }

        .movable-element { position: absolute; pointer-events: auto; user-select: none; z-index: 20; }
        .hud-btn { width: 48px; height: 48px; border-radius: 50%; background: rgba(0,0,0,0.65); border: 2px solid #fff; color: white; font-size: 20px; display: flex; justify-content: center; align-items: center; cursor: pointer; backdrop-filter: blur(4px); }
        .hud-btn.active-green { background: #00ffcc; color: #000; border-color: #00ffcc; }

        #topRightControls { top: 15px; right: 15px; display: flex; gap: 10px; }

        #settingsMenu { position: absolute; top: 70px; left: 15px; background: rgba(15,15,20,0.95); border: 2px solid #ff0055; padding: 15px; border-radius: 12px; color: white; width: 280px; display: none; pointer-events: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.8); z-index: 500; }
        #settingsMenu label { font-size: 12px; display: block; margin-top: 8px; color: #aaa; }
        #settingsMenu input[type="range"] { width: 100%; margin-top: 2px; }
        .settings-btn { width:100%; background:#ff0055; color:white; border:none; padding:10px; border-radius:6px; cursor:pointer; font-weight:bold; margin-top:10px; }

        #joystickZone { bottom: 25px; left: 25px; width: 115px; height: 115px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; }
        #joystickKnob { position: absolute; top: 34px; left: 34px; width: 45px; height: 45px; background: #ff0055; border-radius: 50%; }

        .action-circle-btn { width: 58px; height: 58px; border-radius: 50%; background: rgba(255, 0, 85, 0.85); border: 2px solid #ffffff; color: white; font-size: 13px; font-weight: bold; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .movable-element.edit-mode { outline: 3px dashed #00ffcc !important; }

        #btnJump { bottom: 150px; right: 25px; }
        #btnSprint { bottom: 85px; right: 25px; }
        #btnPunch { bottom: 20px; right: 25px; background: #cc0000; }

        #saveHudBtn { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); background: #00ffcc; color: #000; font-weight: bold; padding: 12px 25px; border-radius: 25px; border: none; display: none; pointer-events: auto; font-size: 17px; cursor: pointer; box-shadow: 0 0 20px #00ffcc; z-index: 600; }

        #crosshair { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: white; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="rotateNotice">📱 يرجى تدوير الموبايل للوضع الأفقي للعب</div>

    <div id="lobbyUI">
        <h1>SQUID GAME AL PRINCES</h1>
        <div class="form-group">
            <label>اسم اللاعب:</label>
            <input type="text" id="pName" placeholder="اسمك">
            <label>رقم اللاعب (1 - 30):</label>
            <input type="number" id="pNum" min="1" max="30" placeholder="123">
            <label>تحديد الجنس:</label>
            <div class="gender-box">
                <div class="gender-btn active" id="gMale" onclick="setGender('male')">ذكر ♂</div>
                <div class="gender-btn" id="gFemale" onclick="setGender('female')">بنت ♀</div>
            </div>
            <label>رمز الدخول للبطولة:</label>
            <input type="text" id="pPass" placeholder="الرمز">
            <button id="joinBtn" onclick="submitJoin()">دخول الساحة</button>
        </div>
    </div>

    <div id="hud">
        <div id="topStats">
            <div id="playerCountDisplay">1/30</div>
            <div id="gameStatusText" style="font-size:16px; color:#ffffff; font-weight:bold;">Waiting for more players.<br>Game starts soon</div>
        </div>

        <div id="topRightControls" class="movable-element">
            <div class="hud-btn" onclick="toggleSettings()">⚙️</div>
            <div class="hud-btn" onclick="toggleFullscreen()">⛶</div>
            <div id="speakerBtn" class="hud-btn active-green" onclick="toggleSpeaker()">🔊</div>
            <div id="micBtn" class="hud-btn" onclick="toggleMic()">🎙️</div>
        </div>

        <div id="settingsMenu">
            <h3 style="margin:0 0 8px 0; color:#ff0055; text-align:center;">الإعدادات</h3>
            <label>حساسية التدوير والرؤية (Sensitivity):</label>
            <input type="range" id="sensSlider" min="1" max="10" value="5" onchange="updateAudioAndSens()">

            <label>🔊 صوت المؤثرات واللعبة (SFX):</label>
            <input type="range" id="sfxSlider" min="0" max="100" value="80" onchange="updateAudioAndSens()">

            <label>🎵 صوت الموسيقى والأغاني (Music):</label>
            <input type="range" id="musicSlider" min="0" max="100" value="70" onchange="updateAudioAndSens()">

            <label>🎙️ صوت المايكات واللاعبين (Voice):</label>
            <input type="range" id="voiceSlider" min="0" max="100" value="100" onchange="updateAudioAndSens()">
            
            <button class="settings-btn" style="background:#00b386;" onclick="enableCustomHud()">تعديل أزرار الواجهة ✏️</button>
            <button class="settings-btn" onclick="location.reload()">خروج من اللعبة</button>
        </div>

        <div id="joystickZone" class="movable-element"><div id="joystickKnob"></div></div>
        <div id="btnJump" class="movable-element action-circle-btn" onclick="doJump()">قفز</div>
        <div id="btnSprint" class="movable-element action-circle-btn" onclick="toggleSprint()">ركض</div>
        <div id="btnPunch" class="movable-element action-circle-btn" onclick="doPunch()">ضرب</div>

        <button id="saveHudBtn" onclick="saveCustomHud()">حفظ الأماكن 💾</button>
        <div id="crosshair"></div>
    </div>

    <audio id="bgMusic" loop></audio>

    <script>
        const socket = io();
        let scene, camera, renderer, selectedGender = 'male';
        let otherPlayers = {};
        let myData = {};
        let isFrontManMode = false, isSprinting = false;
        let sensitivity = 0.005;
        let isMicOn = false, isSpeakerOn = true;
        let mediaRecorder = null, localAudioStream = null;
        let isEditHudMode = false;

        let sfxVolume = 0.8, musicVolume = 0.7, voiceVolume = 1.0;
        let cameraPitch = 0, cameraYaw = 0;

        let audioCtx = null, voiceGainNode = null;
        let nextAudioTime = 0;

        const keys = { w: false, a: false, s: false, d: false };

        window.onload = () => {
            checkOrientation();
            window.addEventListener('resize', checkOrientation);

            const urlParams = new URLSearchParams(window.location.search);
            if(urlParams.get('role') === 'frontman') {
                isFrontManMode = true;
                document.getElementById('pName').value = "Front Man";
                document.getElementById('pNum').value = "0";
                document.getElementById('pPass').value = "sqpr";
            } else {
                if(localStorage.getItem('sg_name')) document.getElementById('pName').value = localStorage.getItem('sg_name');
                if(localStorage.getItem('sg_num')) document.getElementById('pNum').value = localStorage.getItem('sg_num');
            }
            loadCustomHud();
        };

        function checkOrientation() {
            document.getElementById('rotateNotice').style.display = (window.innerHeight > window.innerWidth) ? 'flex' : 'none';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
            else document.exitFullscreen();
        }

        function toggleSettings() {
            const menu = document.getElementById('settingsMenu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function updateAudioAndSens() {
            sensitivity = document.getElementById('sensSlider').value * 0.001;
            sfxVolume = document.getElementById('sfxSlider').value / 100;
            musicVolume = document.getElementById('musicSlider').value / 100;
            voiceVolume = document.getElementById('voiceSlider').value / 100;

            const bgMusic = document.getElementById('bgMusic');
            if(bgMusic) bgMusic.volume = musicVolume;
            if(voiceGainNode) voiceGainNode.gain.value = voiceVolume;
        }

        function setGender(g) {
            selectedGender = g;
            document.getElementById('gMale').classList.toggle('active', g === 'male');
            document.getElementById('gFemale').classList.toggle('active', g === 'female');
        }

        function submitJoin() {
            const name = document.getElementById('pName').value;
            const num = parseInt(document.getElementById('pNum').value);
            const pass = document.getElementById('pPass').value;

            if(!name || (!isFrontManMode && (isNaN(num) || num < 1 || num > 999)) || !pass) {
                return alert("أدخل كافة البيانات واختر رقماً مناسباً!");
            }

            window.AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            voiceGainNode = audioCtx.createGain();
            voiceGainNode.gain.value = voiceVolume;
            voiceGainNode.connect(audioCtx.destination);

            myData = { name, number: num, gender: selectedGender, pass, isFrontMan: isFrontManMode };

            socket.emit('verifyJoin', myData, (res) => {
                if(res.success) {
                    toggleFullscreen();
                    document.getElementById('lobbyUI').style.display = 'none';
                    document.getElementById('hud').style.display = 'block';
                    init3D();
                    setupControls();
                } else { alert(res.message); }
            });
        }

        // بناء اللوبي المطابق تماماً للعبة الأصلي بالصور
        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x131d1b);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ';
            camera.position.set(0, 1.8, 12);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const light = new THREE.DirectionalLight(0xffffff, 1.2);
            light.position.set(0, 35, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x9999aa));

            // أرضية رمادية فاتحة
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0xd2d6dc, roughness: 0.5 }));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // الجدران ثنائية الألوان (أسفل سيراميك أبيض وأعلى أخضر غامق Teal)
            createSquidGameWalls();

            // النفق القوسي الأبيض بالمدخل (نفس الصورة 13)
            createArchwayEntrance();

            // كرة الأموال الذهبية المعلقة بسلاسل بالسقف (نفس الصورة 15 و16)
            createPiggyBank();

            // المدرجات الشاهقة للأسِرّة الطابقية (نفس الصورة 10 و17 و18)
            createTieredBunkBeds();

            // كتابة شعار "الأمراء" والرموز الشفافة فوق القوس الرئيسي
            drawBrandingOnMainWall();

            animate();
        }

        // بناء الجدران بخطوط السيراميك والجزء الأخضر
        function createSquidGameWalls() {
            const wallHeight = 28;
            
            // خامة الجدار السفلي السيراميك الأبيض
            const lowerCanvas = document.createElement('canvas');
            lowerCanvas.width = 512; lowerCanvas.height = 512;
            const lCtx = lowerCanvas.getContext('2d');
            lCtx.fillStyle = '#f0f3f5'; lCtx.fillRect(0, 0, 512, 512);
            lCtx.strokeStyle = '#cccccc'; lCtx.lineWidth = 4;
            for(let y=0; y<=512; y+=64) { lCtx.beginPath(); lCtx.moveTo(0, y); lCtx.lineTo(512, y); lCtx.stroke(); }
            const lowerTex = new THREE.CanvasTexture(lowerCanvas);
            lowerTex.wrapS = THREE.RepeatWrapping; lowerTex.wrapT = THREE.RepeatWrapping; lowerTex.repeat.set(8, 1);

            const lowerMat = new THREE.MeshStandardMaterial({ map: lowerTex });
            const upperMat = new THREE.MeshStandardMaterial({ color: 0x1e4d40, roughness: 0.6 });

            // إضافة الجدران الأربعة
            const walls = [
                { pos: [0, 0, -40], rot: 0 },
                { pos: [0, 0, 40], rot: Math.PI },
                { pos: [-40, 0, 0], rot: Math.PI / 2 },
                { pos: [40, 0, 0], rot: -Math.PI / 2 }
            ];

            walls.forEach(w => {
                const group = new THREE.Group();
                const lower = new THREE.Mesh(new THREE.BoxGeometry(80, 8, 1), lowerMat);
                lower.position.set(0, 4, 0);
                const upper = new THREE.Mesh(new THREE.BoxGeometry(80, 20, 1), upperMat);
                upper.position.set(0, 18, 0);
                group.add(lower); group.add(upper);
                group.position.set(w.pos[0], w.pos[1], w.pos[2]);
                group.rotation.y = w.rot;
                scene.add(group);
            });

            // سقف مظلم
            const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x111816 }));
            ceiling.position.set(0, 28, 0); ceiling.rotation.x = Math.PI / 2;
            scene.add(ceiling);
        }

        // مدخل النفق القوسي الحقيقي بالخلف
        function createArchwayEntrance() {
            const group = new THREE.Group();
            
            const arch = new THREE.Mesh(new THREE.CylinderGeometry(8, 8, 8, 32, 1, true, 0, Math.PI), new THREE.MeshStandardMaterial({ color: 0xeeeeee, side: THREE.DoubleSide }));
            arch.rotation.x = Math.PI / 2;
            arch.position.set(0, 4, -36);
            group.add(arch);

            const door = new THREE.Mesh(new THREE.BoxGeometry(6, 6, 0.2), new THREE.MeshStandardMaterial({ color: 0x222222 }));
            door.position.set(0, 3, -39.8);
            group.add(door);

            scene.add(group);
        }

        // كرة الأموال الذهبية المعلقة بالسقف
        function createPiggyBank() {
            const group = new THREE.Group();

            // كرة زجاجية مع ضوء ذهبي داخلي
            const glassSphere = new THREE.Mesh(
                new THREE.SphereGeometry(4.5, 32, 32),
                new THREE.MeshStandardMaterial({ color: 0xffd700, transparent: true, opacity: 0.65, metalness: 0.9, roughness: 0.1 })
            );
            group.add(glassSphere);

            // ضوء دافئ مشع داخل الكرة
            const innerLight = new THREE.PointLight(0xffaa00, 3, 30);
            group.add(innerLight);

            // أضواء موجهة حول الكرة
            for(let i=0; i<6; i++) {
                const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
                const angle = (i / 6) * Math.PI * 2;
                bulb.position.set(Math.cos(angle)*4.5, Math.sin(angle)*4.5, 0);
                group.add(bulb);
            }

            // سلاسل التعليق بالسقف
            const chain = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 12), new THREE.MeshBasicMaterial({ color: 0x333333 }));
            chain.position.y = 10;
            group.add(chain);

            group.position.set(0, 18, 0);
            scene.add(group);
        }

        // الأسِرّة الطابقية الشاهقة المدرجة
        function createTieredBunkBeds() {
            const bedMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.8 });
            const sheetMat = new THREE.MeshStandardMaterial({ color: 0x829bb0 });

            function createSingleBedStack(x, z, rotY, tiers) {
                const group = new THREE.Group();
                for(let t=0; t<tiers; t++) {
                    const y = t * 1.6;
                    const frame = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.15, 5), bedMat);
                    frame.position.set(0, y + 0.5, 0);
                    const mattress = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.3, 4.8), sheetMat);
                    mattress.position.set(0, y + 0.7, 0);
                    group.add(frame); group.add(mattress);
                }
                // الأعمدة
                for(let px of [-1.2, 1.2]) {
                    for(let pz of [-2.4, 2.4]) {
                        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, tiers * 1.6), bedMat);
                        pole.position.set(px, (tiers * 1.6)/2, pz);
                        group.add(pole);
                    }
                }
                group.position.set(x, 0, z);
                group.rotation.y = rotY;
                scene.add(group);
            }

            // ترتيب الأسِرّة على مدرجات الجوانب والجدار الخلفي
            for(let i=-3; i<=3; i++) {
                if(i !== 0) {
                    createSingleBedStack(i * 7, -32, 0, 4);
                }
            }
            for(let z=-20; z<=20; z+=8) {
                createSingleBedStack(-32, z, Math.PI / 2, 4);
                createSingleBedStack(32, z, -Math.PI / 2, 4);
            }
        }

        // رسم الشعار والرموز الشفافة
        function drawBrandingOnMainWall() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 1024, 512);

            ctx.lineWidth = 14; ctx.strokeStyle = '#222222';
            ctx.beginPath(); ctx.arc(250, 160, 70, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(512, 90); ctx.lineTo(430, 230); ctx.lineTo(594, 230); ctx.closePath(); ctx.stroke();
            ctx.strokeRect(690, 90, 140, 140);

            ctx.fillStyle = '#ff0055';
            ctx.font = 'Bold 46px Segoe UI, Tahoma, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('الأمراء | 𝔞𝔩 𝔭𝔯𝔧𝔫𝔠𝔢𝔰', 512, 360);

            const texture = new THREE.CanvasTexture(canvas);
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(28, 14), new THREE.MeshBasicMaterial({ map: texture, transparent: true }));
            mesh.position.set(0, 15, -39.3);
            scene.add(mesh);
        }

        // إنشاء المجسم البشري الكامل المماثل لصور اللعبة 100%
        function createPlayerMesh(player) {
            const group = new THREE.Group();

            const isFemale = (player.gender === 'female');
            const greenSuitMat = new THREE.MeshStandardMaterial({ color: 0x00a86b, roughness: 0.4 });
            const whiteStripMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xd2986f, roughness: 0.8 });
            const hairMat = new THREE.MeshStandardMaterial({ color: 0x4a2c11 });

            // الرأس (Head)
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 16), skinMat);
            head.position.y = 1.6;
            group.add(head);

            // الشعر البني للولد والبنية (طويل ومربوط للبنات)
            if(isFemale) {
                const hair = new THREE.Mesh(new THREE.SphereGeometry(0.27, 16, 16), hairMat);
                hair.position.set(0, 1.65, -0.05);
                const ponytail = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.03, 0.4), hairMat);
                ponytail.position.set(0, 1.5, -0.3);
                ponytail.rotation.x = -0.5;
                group.add(hair); group.add(ponytail);
            } else {
                const hair = new THREE.Mesh(new THREE.SphereGeometry(0.26, 16, 16), hairMat);
                hair.position.set(0, 1.68, 0);
                group.add(hair);
            }

            // الجذع (Torso)
            const torsoWidth = isFemale ? 0.6 : 0.72;
            const torso = new THREE.Mesh(new THREE.BoxGeometry(torsoWidth, 0.85, 0.38), greenSuitMat);
            torso.position.y = 0.95;
            group.add(torso);

            // القميص الأبيض الداخلي
            const innerShirt = new THREE.Mesh(new THREE.BoxGeometry(torsoWidth * 0.5, 0.86, 0.39), whiteStripMat);
            innerShirt.position.y = 0.95;
            group.add(innerShirt);

            // الخط الأبيض الجانبي على البدلة
            for(let side of [-1, 1]) {
                const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.85, 0.4), whiteStripMat);
                stripe.position.set(side * (torsoWidth/2 + 0.01), 0.95, 0);
                group.add(stripe);
            }

            // الأذرع
            for(let side of [-1, 1]) {
                const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.75), greenSuitMat);
                arm.position.set(side * (torsoWidth/2 + 0.12), 0.9, 0);
                group.add(arm);
            }

            // الساقان
            for(let side of [-1, 1]) {
                const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.1, 0.85), greenSuitMat);
                leg.position.set(side * 0.18, 0.42, 0);
                group.add(leg);

                // حذاء رياضي أبيض
                const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.12, 0.3), whiteStripMat);
                shoe.position.set(side * 0.18, 0.06, 0.05);
                group.add(shoe);
            }

            // طباعة رقم اللاعب المكتوب على الصدر والظهر (نفس صورة 12)
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0)'; ctx.fillRect(0, 0, 256, 128);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'Bold 42px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(`${player.number}`, 128, 75);

            const numTex = new THREE.CanvasTexture(canvas);
            const numSpriteFront = new THREE.Sprite(new THREE.SpriteMaterial({ map: numTex }));
            numSpriteFront.position.set(0, 0.95, 0.21);
            numSpriteFront.scale.set(0.6, 0.3, 1);
            group.add(numSpriteFront);

            // اسم اللاعب أعلى الرأس
            const nameCanvas = document.createElement('canvas');
            const nCtx = nameCanvas.getContext('2d');
            nameCanvas.width = 256; nameCanvas.height = 64;
            nCtx.fillStyle = '#ffffff'; nCtx.font = 'Bold 28px Arial'; nCtx.textAlign = 'center';
            nCtx.fillText(`${player.name}`, 128, 40);

            const nameTex = new THREE.CanvasTexture(nameCanvas);
            const nameSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: nameTex }));
            nameSprite.position.y = 2.05; nameSprite.scale.set(2.5, 0.6, 1);
            group.add(nameSprite);

            scene.add(group);
            otherPlayers[player.id] = group;
        }

        function setupControls() {
            document.addEventListener('keydown', (e) => {
                if(e.code === 'KeyW') keys.w = true;
                if(e.code === 'KeyS') keys.s = true;
                if(e.code === 'KeyA') keys.a = true;
                if(e.code === 'KeyD') keys.d = true;
                if(e.code === 'Space') doJump();
            });
            document.addEventListener('keyup', (e) => {
                if(e.code === 'KeyW') keys.w = false;
                if(e.code === 'KeyS') keys.s = false;
                if(e.code === 'KeyA') keys.a = false;
                if(e.code === 'KeyD') keys.d = false;
            });

            let isTouching = false, lastX = 0, lastY = 0;
            window.addEventListener('touchstart', (e) => {
                if(isEditHudMode || e.target.closest('.movable-element') || e.target.closest('#settingsMenu')) return;
                isTouching = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
            });
            window.addEventListener('touchmove', (e) => {
                if(!isTouching || isEditHudMode) return;
                const deltaX = e.touches[0].clientX - lastX;
                const deltaY = e.touches[0].clientY - lastY;
                
                cameraYaw -= deltaX * sensitivity;
                cameraPitch -= deltaY * sensitivity;
                cameraPitch = Math.max(-1.4, Math.min(1.4, cameraPitch));

                camera.rotation.x = cameraPitch;
                camera.rotation.y = cameraYaw;

                lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
            });
            window.addEventListener('touchend', () => isTouching = false);

            document.addEventListener('click', (e) => {
                if(document.getElementById('hud').style.display === 'block' && !isEditHudMode && !e.target.closest('#settingsMenu') && !e.target.closest('.movable-element')) {
                    document.body.requestPointerLock();
                }
            });
            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body && !isEditHudMode) {
                    cameraYaw -= e.movementX * sensitivity;
                    cameraPitch -= e.movementY * sensitivity;
                    cameraPitch = Math.max(-1.4, Math.min(1.4, cameraPitch));

                    camera.rotation.x = cameraPitch;
                    camera.rotation.y = cameraYaw;
                }
            });

            setupJoystick();
        }

        function setupJoystick() {
            const zone = document.getElementById('joystickZone');
            const knob = document.getElementById('joystickKnob');
            let active = false;

            zone.addEventListener('touchstart', () => { if(!isEditHudMode) active = true; });
            window.addEventListener('touchend', () => {
                active = false; knob.style.top = '34px'; knob.style.left = '34px';
            });

            zone.addEventListener('touchmove', (e) => {
                if(!active || isEditHudMode) return;
                const touch = e.touches[0];
                const rect = zone.getBoundingClientRect();
                const x = touch.clientX - rect.left - 57;
                const y = touch.clientY - rect.top - 57;
                const dist = Math.min(Math.hypot(x, y), 35);
                const angle = Math.atan2(y, x);

                knob.style.left = `${34 + Math.cos(angle) * dist}px`;
                knob.style.top = `${34 + Math.sin(angle) * dist}px`;

                const speed = (isSprinting ? 0.22 : 0.1);
                moveCameraWithCollision((Math.cos(angle) * dist / 35) * speed, (Math.sin(angle) * dist / 35) * speed);
            });
        }

        // نظام الحركة المانع للخروج واختراق الجدران
        function moveCameraWithCollision(translateX, translateZ) {
            const oldX = camera.position.x;
            const oldZ = camera.position.z;

            camera.translateX(translateX);
            camera.translateZ(translateZ);

            // حدود الساحة الفيزيائية يمنع الخروج خارج (-38 إلى 38)
            camera.position.x = Math.max(-37.5, Math.min(37.5, camera.position.x));
            camera.position.z = Math.max(-37.5, Math.min(37.5, camera.position.z));
        }

        function enableCustomHud() {
            isEditHudMode = true;
            if(document.exitPointerLock) document.exitPointerLock();
            toggleSettings();
            document.getElementById('saveHudBtn').style.display = 'block';

            document.querySelectorAll('.movable-element').forEach(el => {
                el.classList.add('edit-mode');
                makeElementDraggable(el);
            });
        }

        function makeElementDraggable(el) {
            let pX = 0, pY = 0;
            el.ontouchstart = (e) => {
                pX = e.touches[0].clientX - el.offsetLeft;
                pY = e.touches[0].clientY - el.offsetTop;
                document.ontouchmove = (ev) => {
                    if(!isEditHudMode) return;
                    el.style.left = `${ev.touches[0].clientX - pX}px`;
                    el.style.top = `${ev.touches[0].clientY - pY}px`;
                    el.style.bottom = 'auto'; el.style.right = 'auto';
                };
            };
        }

        function saveCustomHud() {
            isEditHudMode = false;
            document.getElementById('saveHudBtn').style.display = 'none';
            const hudData = {};

            document.querySelectorAll('.movable-element').forEach(el => {
                el.classList.remove('edit-mode');
                el.ontouchstart = null;
                hudData[el.id] = { left: el.style.left, top: el.style.top };
            });

            localStorage.setItem('sg_custom_hud_v4', JSON.stringify(hudData));
            alert("تم حفظ توزيع الأزرار بنجاح!");
        }

        function loadCustomHud() {
            const saved = localStorage.getItem('sg_custom_hud_v4');
            if(saved) {
                const hudData = JSON.parse(saved);
                Object.keys(hudData).forEach(id => {
                    const el = document.getElementById(id);
                    if(el) {
                        el.style.left = hudData[id].left;
                        el.style.top = hudData[id].top;
                        el.style.bottom = 'auto'; el.style.right = 'auto';
                    }
                });
            }
        }

        async function toggleMic() {
            const micBtn = document.getElementById('micBtn');
            if(!isMicOn) {
                try {
                    localAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(localAudioStream);
                    mediaRecorder.ondataavailable = e => {
                        if(e.data && e.data.size > 0) {
                            e.data.arrayBuffer().then(buf => socket.emit('playerVoiceStream', buf));
                        }
                    };
                    mediaRecorder.start(200);
                    isMicOn = true;
                    micBtn.classList.add('active-green');
                } catch(err) { alert("يرجى إعطاء إذن استخدام المايك!"); }
            } else {
                if(mediaRecorder) mediaRecorder.stop();
                if(localAudioStream) localAudioStream.getTracks().forEach(t => t.stop());
                isMicOn = false;
                micBtn.classList.remove('active-green');
            }
        }

        function toggleSpeaker() {
            isSpeakerOn = !isSpeakerOn;
            document.getElementById('speakerBtn').classList.toggle('active-green', isSpeakerOn);
        }

        function playStreamBuffer(arrayBuffer) {
            if(!isSpeakerOn || !audioCtx) return;
            audioCtx.decodeAudioData(arrayBuffer, (buffer) => {
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(voiceGainNode);
                const currentTime = audioCtx.currentTime;
                if (nextAudioTime < currentTime) nextAudioTime = currentTime;
                source.start(nextAudioTime);
                nextAudioTime += buffer.duration;
            }, () => {});
        }

        socket.on('receiveAdminVoice', playStreamBuffer);
        socket.on('receivePlayerVoice', data => playStreamBuffer(data.buffer));

        socket.on('syncMusic', (data) => {
            const audio = document.getElementById('bgMusic');
            if(data.action === 'play' && data.audioData) {
                audio.src = data.audioData;
                audio.volume = musicVolume;
                audio.play().catch(() => alert("اضغط على الشاشة لسماع الموسيقى!"));
            } else if(data.action === 'pause') audio.pause();
            else if(data.action === 'stop') { audio.pause(); audio.currentTime = 0; }
        });

        function doJump() { if(!isEditHudMode) { camera.position.y = 2.6; setTimeout(() => camera.position.y = 1.8, 300); } }
        function toggleSprint() { if(!isEditHudMode) isSprinting = !isSprinting; }
        function doPunch() { if(!isEditHudMode) socket.emit('playerPunch', Object.keys(otherPlayers)[0]); }

        function animate() {
            requestAnimationFrame(animate);

            if(!isEditHudMode) {
                const speed = isSprinting ? 0.22 : 0.1;
                if(keys.w) moveCameraWithCollision(0, -speed);
                if(keys.s) moveCameraWithCollision(0, speed);
                if(keys.a) moveCameraWithCollision(-speed, 0);
                if(keys.d) moveCameraWithCollision(speed, 0);
            }

            if(renderer && scene && camera) {
                renderer.render(scene, camera);
                socket.emit('playerMove', { 
                    x: camera.position.x, 
                    y: camera.position.y, 
                    z: camera.position.z, 
                    rotationY: cameraYaw,
                    rotationX: cameraPitch
                });
            }
        }

        socket.on('kickedFromGame', () => { alert("تم إقصاؤك من المباراة!"); location.reload(); });
        socket.on('updatePlayerCount', c => document.getElementById('playerCountDisplay').innerText = `${c}/30`);
        socket.on('currentPlayers', players => Object.values(players).forEach(p => { if(p.id !== socket.id) createPlayerMesh(p); }));
        socket.on('newPlayerJoined', p => createPlayerMesh(p));
        socket.on('playerMoved', p => { if(otherPlayers[p.id]) otherPlayers[p.id].position.set(p.x, p.y - 0.9, p.z); });
        socket.on('playerDisconnected', id => { if(otherPlayers[id]) { scene.remove(otherPlayers[id]); delete otherPlayers[id]; } });
    </script>
</body>
</html>
